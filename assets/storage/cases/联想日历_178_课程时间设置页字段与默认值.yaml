meta:
  case_id: "178"
  title: 联想日历_178_课程时间设置页字段与默认值
  package: com.zui.calendar
  knowledge_files:
    - knowledge/com.zui.calendar.md
    - knowledge/paths/com.zui.calendar.md

preconditions:
  - kind: data
    desc: 清数据回到干净状态，保证走的是「手动创建」路径（默认值：50分钟/10分钟/上午4节/下午4节/晚上4节）
    do: pm clear com.zui.calendar
  - kind: nav
    desc: 清理后停在日历首页
    target: activity=.AllInOneActivity
    assert_start: activity=.AllInOneActivity

steps:
  - id: s0
    desc: 依次点掉 pm clear 后的框（「同意」button1 → 课程表引导 timetable_guide_button），落回日历首页
    target: rid=button1
    landing: activity=.AllInOneActivity
    pitfalls:
      - "先 button1「同意」，再 timetable_guide_button「我知道了」。"
      - "没出现这两屏说明没清数据；已在首页则本步 landing 仍满足。"

  - id: s1
    desc: 点首页右上角「更多」（iv_more），菜单里选「课程表」，进入课程表空态页
    target: rid=iv_more
    landing: activity=.timetable.display.TimetableActivity
    pitfalls:
      - "iv_more 无 text/desc，按 rid 定位；菜单四项共用 item_title，按 text 选「课程表」。"

  - id: s2
    desc: 点「手动创建课程表」（btnCreateManually），进入课程表基本信息编辑页
    target: rid=btnCreateManually
    landing: activity=.timetable.management.EditTimetableActivity
    pitfalls:
      - "三个入口直接铺屏，用 rid 定位。"

  - id: s3
    desc: 点「课程时间设置」行（layout_time_settings），进入课程时间设置页
    target: rid=layout_time_settings
    landing: activity=.timetable.management.TimeSlotSettingsActivity
    know:
      where: 课程表基本信息编辑页 → 课程时间设置页
      why_this: 用例步骤 1「点击课程时间设置」
      locate: 入口 rid 是 layout_time_settings（不是 layout_time_slot_settings）
    pitfalls:
      - "进页面立刻读首屏值（上课时长/休息时长/上午/下午节数）—— 元素不在当前视口时按 rid 读会返回空字符串。"
      - "晚上节数要上滑才可见（懒加载），先读首屏再上滑。"
      - "本页是 TimeSlotSettingsActivity，别和基本信息编辑页搞混。"

  - id: s4
    desc: 点「每节课上课时长」行（layout_lesson_duration），打开时长弹框，观察默认可选范围，随后点「取消」关闭
    target: rid=layout_lesson_duration
    landing: activity=.timetable.management.TimeSlotSettingsActivity
    pitfalls:
      - "可点的容器是 layout_lesson_duration，tv_lesson_duration 只是值节点（clickable=false），点值节点无效 —— 必须点 layout_。"
      - "弹框内容区是 Canvas 自绘（customPanel 下无 dump 子节点），当前值读不到；不要试图读数字，也不要拨档。"
      - "落点判据用的是「仍在本页」——弹框是叠加层不换 activity，所以这点成立即表示没跳走；弹框是否真弹出需看图。"

  - id: s5
    desc: 点「课间休息时长」行（layout_break_duration），打开休息时长弹框，随后点「取消」关闭
    target: rid=layout_break_duration
    landing: activity=.timetable.management.TimeSlotSettingsActivity
    pitfalls:
      - "同样必须点 layout_break_duration 容器，不是 tv_break_duration 值节点。"
      - "弹框同理是 Canvas 自绘，只验打开；看完点「取消」。"

assertions:
  - id: a1
    desc: 正常进入课程时间设置页
    check:
      activity: .timetable.management.TimeSlotSettingsActivity

  - id: a2
    desc: 每节课上课时长默认 50 分钟（手动创建路径）
    check:
      node_text: {rid: tv_lesson_duration, equals: "50分钟"}

  - id: a3
    desc: 课间休息时长默认 10 分钟
    check:
      node_text: {rid: tv_break_duration, equals: "10分钟"}

  - id: a4
    desc: 默认上午 4 节、下午 4 节（晚上 4 节需上滑才可见，单独记）
    check:
      nodes_present:
        - {rid: tv_morning_slot_count}
        - {rid: tv_afternoon_slot_count}

  - id: a5
    desc: 每节课上课时长、课间休息时长两个可点入口存在（时长设置入口可操作）
    # ⚠️ 为什么不判"弹框已打开"：两个时长弹框内容区是 Canvas 自绘（customPanel 下无 dump 子节点），
    # 弹框自身的稳定 rid 未在知识卡中确认。用入口 rid 存在 + 步骤里实际点开录像更稳，
    # 弹框"是否真的弹了"在本次自动化里没有可靠结构化判据 —— 见 note。
    note: 弹框是否真的弹出未做结构化核对（Canvas 自绘、暂无确认的弹框 rid），需人工看图
    check:
      nodes_present:
        - {rid: layout_lesson_duration}
        - {rid: layout_break_duration}

  - id: a6
    desc: 上午/下午/晚上节数的加减小节入口存在
    check:
      nodes_present:
        - {rid: btn_add_morning_slot}
        - {rid: btn_remove_morning_slot}
