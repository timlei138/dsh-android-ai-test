meta:
  case_id: "183"
  title: 联想日历_183_点击课程进入编辑弹框与删除课程
  package: com.zui.calendar
  knowledge_files:
    - knowledge/com.zui.calendar.md
    - knowledge/paths/com.zui.calendar.md

preconditions:
  - kind: data
    desc: 清数据回到干净状态，保证从「手动创建 → 添加课程」这条可控路径造出待删课程
    do: pm clear com.zui.calendar
  - kind: nav
    desc: 清理后停在日历首页
    target: activity=.AllInOneActivity
    assert_start: activity=.AllInOneActivity

steps:
  - id: s0
    desc: 依次点掉 pm clear 后的框（「同意」button1 → 课程表引导 timetable_guide_button），落回日历首页
    target: rid=button1
    landing: activity=.AllInOneActivity
    pitfalls:
      - "先 button1「同意」，再 timetable_guide_button「我知道了」。"
      - "这两屏只在 pm clear 后出现；已在首页则本步 landing 仍满足。"

  - id: s1
    desc: 点首页右上角「更多」（iv_more），菜单里选「课程表」，进入课程表空态页
    target: rid=iv_more
    landing: activity=.timetable.display.TimetableActivity
    pitfalls:
      - "iv_more 无 text/desc，按 rid 定位；菜单四项共用 item_title，按 text 选「课程表」。"

  - id: s2
    desc: 点「手动创建课程表」（btnCreateManually），进入课程表基本信息编辑页
    target: rid=btnCreateManually
    landing: activity=.timetable.management.EditTimetableActivity
    pitfalls:
      - "三个入口直接铺屏，用 rid 定位。"

  - id: s3
    desc: 在名称框（et_schedule_name）输入课程表名称，再点右上角「完成」（save_view）保存，落到课程表周视图
    target: rid=et_schedule_name
    landing: activity=.timetable.display.TimetableActivity
    know:
      where: 课程表基本信息编辑页 → 周视图
      why_this: 需要一个已保存的课程表，才能在其上点课程卡片（用例前提）
      locate: 名称框 et_schedule_name，保存 save_view
    pitfalls:
      - "名称必填，不填点完成会被校验拦住、停在原页。"
      - "保存后的落点是周视图（不是列表页）。"
      - "不要按 back 收键盘。"

  - id: s4
    desc: 在周视图点某一节课格子（cv_empty_content）两次（第一次点击被吸收），进入添加课程页
    target: rid=cv_empty_content
    landing: activity=.timetable.course.EditCourseActivity
    pitfalls:
      - "点空格要两次：第一次点击被吸收、连 UI 树都不变，第二次才进页面。不要因为第一次没跳转就以为点错。"
      - "不要再等加号浮标 iv_add_hint —— 该中间态已随改版移除。"

  - id: s5
    desc: 在添加课程页填课程名（etCourseName），点「完成」保存该课程，回到周视图
    landing: activity=.timetable.display.TimetableActivity
    pitfalls:
      - "课程名必填；保存按钮由页面「完成」承担，找不到明确的 rid 时用返回/完成均可，判据看是否回到周视图。"
      - "不要按 back 收键盘 —— 有输入法时第 1 次只收键盘。"

assertions:
  - id: a1
    desc: 点击单个课程后显示编辑课程弹框，可编辑课程信息，底部有「删除课程」按钮
    check:
      activity: .timetable.course.EditCourseActivity

  - id: a2
    desc: 编辑课程弹框含课程名、教室、备注字段与上课时间/周数/背景色三项
    check:
      nodes_present:
        - {rid: etCourseName}
        - {rid: llCourseTime}
        - {rid: llCourseWeeks}
        - {rid: llCourseColor}

  - id: a3
    desc: 编辑态底部有「删除课程」按钮
    check:
      node_present: {rid: btnDelete}
