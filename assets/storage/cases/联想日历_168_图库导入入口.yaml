# 168 图库导入入口
#
# 用途：验证「日历 → 课程表 → 从图库导入 → 点掉提示框 → 到达图片选择器」这条链路。
#
# ★ 本文件的写法遵循 docs/执行机制.md：
#     · 不存坐标 —— 换设备/分辨率即失效，是"非常不可靠的东西"
#     · 不用 locate_seq（按序重放的旧机制，已删除）
#     · target 只写**一个**能唯一定位的表达式；代码命中恰好 1 个才直点，
#       0 个或 >1 个一律交回模型判断 —— 宁可多问一次，也不赌
#     · desc 三要素：做什么动作 + 在哪个控件 + 做完应该看到什么

meta:
  case_id: "168"
  title: 联想日历_168_图库导入入口
  package: com.zui.calendar
  knowledge_files:
    - knowledge/com.zui.calendar.md
    - knowledge/paths/com.zui.calendar.md

# 这条用例的可信度 —— 说明它是怎么来的、还差什么。
# 不写清楚，后来人会把"照着文档写的链路"误读成"真机验证过的链路"。
# ⚠️ 必须在**顶层**：loader 读的是 raw["confidence"]，写在 meta 里等于没写。
confidence:
  level: verified
  reason: 链路已在真机上逐步走过（更多 → 课程表 → 从图库导入 → 提示框 → PhotoPicker）
  todo:
    - 不同分辨率下 iv_more 的 rid 是否稳定（已在 3040x1904 上验证）

per_step_pitfalls: true

preconditions:
  - kind: data
    desc: 清理日历数据，回到首次使用态（用例原文前提「清理APP数据」）
    do: pm clear com.zui.calendar
    # 已经在首页、且没残留数据时不必再清 —— 省掉一次冷启动
    skip_if: {activity: .AllInOneActivity}
  - kind: nav
    desc: 起点：走完 pm clear 后的两屏，停在日历首页
    target: activity=.AllInOneActivity
    do: 先点「同意」关掉权限说明框，再点「我知道了」跳过课程表引导
    assert_start: activity=.AllInOneActivity

steps:
  - id: s0
    desc: 依次点掉 pm clear 后弹出的两个框（「同意」权限说明框 →「我知道了」课程表引导），落回日历首页
    target: rid=button1
    landing: activity=.AllInOneActivity
    pitfalls:
      - "顺序不能反：先 button1「同意」，再 timetable_guide_button「我知道了」。"
      - "权限说明框是日历自己的（包名仍是 com.zui.calendar），不是系统权限框 —— 点「同意」，不要点「退出」。"
      - "这两屏只在 pm clear 之后出现。没出现时本步 landing 仍应满足（已在首页），不算失败。"
      - "第二屏是课程表引导页，按钮是 timetable_guide_button「我知道了」；引导页不点掉会影响后面找 iv_more。"

  - id: s1
    desc: 点右上角「更多」按钮（iv_more），在弹出菜单里选「课程表」，进入课程表页
    target: rid=iv_more
    landing: activity=.timetable.display.TimetableActivity
    know:
      where: 首页 → 课程表
      why_this: 课程表的入口不在首页直接露出来，藏在「更多」菜单里
      locate: iv_more 是右上角那个图标按钮，本身没有任何文字
    pitfalls:
      - "iv_more 没有 text/desc —— 用文案找「更多」会找不到，必须按 rid 定位。"
      - "菜单四项共用 rid item_title，只能按 text 区分；这一步代码只能点到 iv_more 为止，菜单里的选择交给模型。"
      - "若菜单没弹出（点空了），不要重复点同一坐标硬试 —— 回读 activity 确认当前在哪。"
      - "整条链路是四段：更多 → 课程表 → 从图库导入 → 点掉提示框。中间任一段漏掉都会『看起来没反应』。"

  - id: s2
    desc: 在空课程表页点「从图库导入课程表」（btnImportFromGallery），点掉弹出的「请确保图片清晰、完整」提示框（button1），进入系统图片选择器
    target: rid=btnImportFromGallery
    # ★ 落点必须是**稳定终态**，不能是"提示框刚弹出的那一瞬"。
    #
    # 原来 s2 写 landing: rid=button1（提示框出现），s3 再点掉它。
    # 真机 FAIL：模型有自主性，点完按钮顺手就把提示框也点了、
    # 直接进了图片选择器 —— 等轮到 s2 判定时框早没了，
    # 于是"声明完成但落点不符"，可三条断言其实全过（假 FAIL）。
    #
    # 判据要落在"这条链路走完的稳定状态"上：进了选图界面就一直在那，
    # 中间那两个瞬时框（App 提示框、系统权限框）谁先谁后都不影响判定。
    #
    # ★ 用 album=any 而不是写死 Activity 类名 —— 见 a3 的说明。
    #   "到了任意一种选图/相册界面"就算落点达成。
    landing: album=any
    pitfalls:
      - "空状态没有「更多」菜单：三个入口按钮直接铺屏（拍照导入 / 从图库导入 / 手动创建），用 rid 定位，别按位置猜。"
      - "本用例只验入口能进去，不验导入流程。到图片选择器即止，不要继续选图（会触发约 20s 云端解析）。"
      - "点了这个按钮**先弹日历自己的提示框**（button1「知道了」），不是直接到图库 —— 别因为没看到图片选择器就以为点空了。"
      - "两段式、有先后：①App 内提示框「请确保图片清晰、完整」→ 点「知道了」；②系统权限弹窗（仅未授予时才弹，已授予直接跳过）。第①段不点掉，PhotoPicker 不会出现。"
      - "顺序不固定：权限已授予时点完「知道了」直接进图库；未授予时中间会插一个系统权限框（com.android.permissioncontroller）。两者都要走到图库才算完。"
      - "不要用『功能没反应』断定缺陷 —— 先确认提示框是否已点掉。"
      - "该提示框是日历自己的，不是系统权限框 —— 不需要也不应该去 revoke/grant 权限。"
      - "本步只点到图片选择器为止。**不要选图**：所有缩略图共用 icon_thumbnail 一个 rid，且按媒体库时间倒序，第一张取决于最近有什么，盲点必错。"
      - "若继续走导入流程（本用例不需要）：解析需联网约 20s，等待窗口给到 60s；低于 20s 会在解析中途误判超时。"

assertions:
  - id: a1
    desc: 可打开课程表页面
    check:
      activity: .timetable.display.TimetableActivity

  - id: a2
    desc: 图库导入入口可点击（点了弹出日历自己的提示框，即有响应）
    check:
      node_present: {rid: btnImportFromGallery}

  - id: a3
    desc: 可正常进入图片选择入口（打开任意一种选图/相册界面即算通过）
    # ★ 这里**不写死具体 Activity 类名**。
    #
    # 原来写的是：
    #     activity: com.android.providers.media.photopicker.PhotoPickerGetContentActivity
    # 真机 Android 17 上系统给的是 ...PhotoPickerUserSelectActivity，直接 FAIL。
    # 可功能是对的 —— 图库确实打开了，只是类名跟文档里不一样。
    #
    # 用例要验的是"能不能进到选图界面"，不是"系统用的是哪个类"。
    # 后者是实现细节，换版本/换 ROM 就变，钉死它等于自找误报。
    #
    # album_reached 按界面**用途**判：系统图片选择器 / 文档选择器 /
    # 相册类 App，命中任意一个就算到达。具体打开了哪一个会写进报告的
    # actual 里，排查时仍然看得到。
    check:
      album_reached: true
