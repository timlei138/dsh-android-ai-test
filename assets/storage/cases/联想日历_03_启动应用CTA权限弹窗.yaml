# 03 启动应用-CTA权限弹窗（P2）
#
# 用途：验证「清数据后首次启动日历 → 弹权限说明框 → 点同意 → 走完授权 → 回到日历」。
#
# ★ 本文件不是照文档抄的：弹框的 rid 和文案是**在真机上读出来的**
#   （pm clear 后首次启动，dump 层级确认）：
#       标题  com.zui.calendar:id/alertTitle  text=「日历需要使用以下权限」
#       正文  出现「必要权限」「可选权限」两组
#       按钮  android:id/button1=同意（右）  android:id/button2=退出（左）
#
#   本机是 Android 17，对应用例原文里「16.1」那套文案；原文的「16.0」不适用。
#
# ★ 只覆盖「点同意」这一支。
#   用例原文步骤写的是「点击同意、退出」，是**两支**：
#       点同意 -> 获取权限、进入日历
#       点退出 -> 退出应用
#   一次运行只能走一支。本文件走「同意」；「退出」那一支需要清数据后
#   单独跑一次（把 target 改成 button2）。这条限制不给结论留模糊空间。

meta:
  case_id: "03"
  title: 联想日历_03_启动应用CTA权限弹窗
  package: com.zui.calendar
  knowledge_files:
    - knowledge/com.zui.calendar.md
    - knowledge/paths/com.zui.calendar.md
    - knowledge/_system.md

# 这条用例是怎么来的 —— 不写清楚，后来人会把"照真机读过 rid"误当成"跑通过"。
# ⚠️ 必须在**顶层**：loader 读的是 raw["confidence"]，写进 meta 等于没写。
confidence:
  level: unverified
  reason: 现场按用例原文拆解；弹框的 rid / 文案已在真机读取核对，但这条用例还没完整跑过一次
  todo:
    - 本用例尚未真机跑通
    - "第一次跑失败在拆解错误（把权限说明框当成了起点 target: rid=alertTitle），
       执行器为回到起点把框点掉，之后 15 轮空转找 alertTitle。已改成
       target: activity=.AllInOneActivity（起点必须是常驻页面，弹框是一次性的）"
    - 弹框正文**逐条权限名称**（访问网络 / 访问文件 / 读取音乐和音频 / 读取联系人 / 获取设备信息）未做结构化核对，需人工看图
    - 用例原文前提「不连接网络」未施加 —— 那是改设备网络设置，有副作用，不能在用例里悄悄做
    - 「点退出 -> 退出应用」那一支未覆盖，需要另跑一次

# 坑按步给：走到哪步只看那步的 pitfalls，别把整篇的坑堆在眼前
per_step_pitfalls: true

preconditions:
  - kind: data
    desc: 清理 APP 数据，回到首次启动态（用例原文前提「首次启动/清除应用数据」）
    do: pm clear com.zui.calendar
  - kind: nav
    desc: 清数据后首次启动日历，停在日历首页（权限说明框就浮在首页上，由 s0 处理）
    # ★★ 起点**必须**是稳定状态，不能是那个弹框。
    #
    #   第一版写的是 target: rid=alertTitle（把弹框当起点），真机实测直接空转：
    #     轮01 执行器为了"回到起点"，看到弹框挡路就把「同意」点了
    #     → 弹框从此消失 → alertTitle 永远不会再出现
    #     → 之后 15 轮全在 fix_start 里找它，问知识库、问视觉模型，一步没往前走。
    #
    #   弹框是**一次性的**：点掉就没了。拿它当"要到达的状态"，等于要求
    #   执行器去找一个已经被自己消费掉的东西。起点只能是常驻的页面。
    target: activity=.AllInOneActivity
    assert_start: activity=.AllInOneActivity

steps:
  - id: s0
    desc: 首次启动日历后出现「日历需要使用以下权限」说明框（标题 alertTitle、正文「必要权限」「可选权限」两组、底部「退出」与「同意」两个按钮），点右下角「同意」（android:id/button1），走完随后的系统权限申请，回到日历界面
    target: rid=button1
    # 落点允许两个，因为这条路径本来就分岔（与 167 的首次启动链路一致）：
    #   权限说明框 --同意--> 系统权限框 --允许--> 日历首页 / 课程表引导页
    # 引导页是首页上的浮层，属于正常中间态，不是失败。
    landing: activity=.AllInOneActivity|TimetableGuideActivity
    know:
      where: 清数据后的首次启动
      why_this: 用例步骤 1「首次进入日历-查看权限弹框」、步骤 2「点击同意」
      locate: 同意按钮是 android:id/button1（右侧），退出是 button2（左侧）
    pitfalls:
      - "这是日历**自己的**权限说明框（包名仍是 com.zui.calendar），不是系统权限框 —— 点「同意」，不要点「退出」。"
      - "button1 / button2 是系统通用 rid，删除确认、设为当前确认、权限弹窗都在用。这一屏必须**看清 text** 再点：button1=同意，button2=退出。点错就是把应用退出去。"
      - "一命中就点会点空（入场动画未结束）—— 等约 1.5s 再点，点完核对框已消失。"
      - "★ 这个框只在 pm clear 后首次启动出现一次。**如果起点整理阶段它已经被点掉了**，本步找不到 button1 是正常的（不是失败）—— 直接按 landing 判，别反复找它。"
      - "点「同意」之后还会弹**系统权限框**（com.android.permissioncontroller），那不是本步目标，执行器会自动点「允许」；多权限时会连着问好几次，一直点允许到框消失。"
      - "系统权限框约 6 秒不点会自动消失 —— 看到它一闪而过不算失败，继续等界面落定。"
      - "落点可能是日历首页，也可能是课程表引导页（「课程表上新了！」，按钮 timetable_guide_button）—— 后者是正常中间态，不要因为不是首页就重复点。"
      - "若这一轮完全没看到权限说明框：说明数据没清干净（本地已记「看过」）。那是前提没达成，不是产品缺陷 —— 复位后重跑，别继续往下判。"

assertions:
  - id: a1
    desc: 首次启动日历弹出 App 权限说明框，标题为「日历需要使用以下权限」
    # 用 node_text 而不是"当前屏有没有"：断言在末尾才判，那时框早就点掉了。
    # node_text 看的是**过程中见过**的文案（见 nodes.py _text_seen），正好对上。
    check:
      node_text: {rid: alertTitle, text: 日历需要使用以下权限}

  - id: a2
    desc: 弹框提供「退出」和「同意」两个操作（用例预期「点击退出退出应用，点击同意即可获取对应权限」）
    check:
      nodes_present:
        - {rid: button1}
        - {rid: button2}

  - id: a3
    desc: 弹框按「必要权限」分组展示要申请的权限（Android 17 / 用例原文 16.1 版本文案）
    note: 只核对了分组标题「必要权限」在过程中出现过；分组内的逐条权限名称需人工看图
    check:
      node_text: {text: 必要权限}

  - id: a4
    desc: 弹框按「可选权限」分组展示附加权限（用例原文 16.1 版本文案）
    note: 只核对了分组标题「可选权限」在过程中出现过；分组内的逐条权限名称需人工看图
    check:
      node_text: {text: 可选权限}

  - id: a5
    desc: 点「同意」后走完授权流程，离开权限说明框、回到可正常使用的日历界面
    # 这条**故意不给代码判据**，交给模型看图。
    #
    # 为什么代码判不了：说明框是日历自己的弹框，它浮在 .AllInOneActivity 上，
    # 所以"activity 到达过 AllInOneActivity"在点之前就已经成立了 —— 拿它当
    # "框已关闭、授权成功"的判据是假证据。
    # 而"框现在还在不在"这类判据只认 rid 出现过（ever seen），也表达不了"已消失"。
    # 判"同意之后到底有没有顺利进到日历"，让模型看一眼最可靠。
    check: null
