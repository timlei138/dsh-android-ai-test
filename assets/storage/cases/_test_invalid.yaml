# ❌ 故意写错的样例 —— 用来验证 case_spec_check.py 能拦住所有已知陷阱。
# 这个文件**必须**被判为不合格。每一项错的旁边都标了期望的检查结果。

meta:
  case_id: "999"
  title: 故意违规样例
  package: com.zui.calendar
  derived_from:            # ← 期望 DEAD（meta 不认识 derived_from）
    session: 435

playbook:                  # ← 期望 DEAD（顶层不认识 playbook）
  - title: 某种须知

preconditions:
  - type: clean            # ← 期望 ERROR（kind 才对，没有 kind）
    do: pm clear com.zui.calendar
  - kind: env              # ← 期望 ERROR（env 没给 undo，模型层会拒绝）
    do: settings put global airplane_mode_on 1
  - kind: prepare_data     # ← 期望 ERROR（kind 只能是 data/env/nav）

steps:
  - id: s1
    desc: 各种错误的集合
    do:                    # ← 期望 DEAD（StepSpec 没有 do 字段）
      - tap: {rid: iv_more}
    expect:                # ← 期望 DEAD（StepSpec 没有 expect 字段）
      title: 课程表        # （嵌套在死字段里，不单独报）
    landing: activity=TimetableActivity
    on_fail: BLOCKED       # ← 期望 DEAD（StepSpec 没有 on_fail）

  - id: s2
    desc: 落点表达式写错
    landing: title=.Foo    # ← 期望 ERROR（落点键只有 activity/rid/text/desc/package）
    locate: rid=ok

  - id: s2                # ← 期望 ERROR（id 重复）
    desc: 缺 landing
    locate: rid=xxx        # ← 期望 warn（没有 landing，代码判不了，会交模型）

  - id: s3
    desc: locate_seq 里藏一个坏表达式
    locate_seq:
      - rid=good
      - swipeleft=1        # ← 期望 ERROR（swipeleft 不是落点键）

  - id: s4
    desc: pitfalls 形状不对
    landing: activity=.Foo
    locate: rid=bar
    pitfalls:
      - "这条是合法的字符串坑"
      - text: 这是旧格式的字典坑   # ← 期望 DEAD（StepSpec.pitfalls 是 list[str]）
        from: com.zui.calendar.md#某节
      - 123                        # ← 期望 ERROR（不是字符串）
      - ""                         # ← 期望 warn（空字符串）

assertions:
  - id: a1
    desc: 判据键不存在
    check:
      title: 课程表        # ← 期望 ERROR（KNOWN_CHECKS 里没有 title）
      switch_on: 周末有课   # ← 期望 ERROR（同上）

  - id: a2
    desc: dialog_present 不带 rid
    check:
      dialog_present: {text: 确定}   # ← 期望 ERROR（取不到 rid）

  - id: a3
    desc: dialog_present 写成裸字符串
    check:
      dialog_present: "关闭"          # ← 期望 ERROR（会把"关闭"当 rid，成恒假判据）

  - id: a4
    desc: 合法的判据（不该报错）
    check:
      activity: .timetable.display.TimetableActivity
      node_present: {rid: toolbar_title}
      permission: {CAMERA: true}
      note: 这条是对的

  - id: a5
    desc: 死字段
    case_expect: "某条原文"
    status_last_run: PASS   # ← 期望 DEAD（AssertSpec 只有 id/desc/check）
