meta:
  case_id: "167"
  title: 联想日历_167_首次进入课程表引导与空态
  package: com.zui.calendar
  knowledge_files:
    - knowledge/com.zui.calendar.md
    - knowledge/paths/com.zui.calendar.md

preconditions:
  - kind: data
    desc: 首次打开日历（用例原文前提）—— 必须清数据，引导框只在 pm clear 后首次启动出现
    do: pm clear com.zui.calendar
  - kind: nav
    desc: 清理后停在日历首页，准备点掉权限说明框
    target: activity=.AllInOneActivity
    assert_start: activity=.AllInOneActivity

steps:
  - id: s0
    desc: 点掉 pm clear 后的「同意」权限说明框（日历自己的框，按钮 android:id/button1），落回日历首页
    target: rid=button1
    landing: activity=.AllInOneActivity
    pitfalls:
      - "一命中就点会点空（入场动画未结束）—— 等约 1.5s 再点，点完核对框已消失。"
      - "这是日历自己的权限说明框（包名仍是 com.zui.calendar），点「同意」不要点「退出」。"
      - "此时可能还会看到课程表引导框「课程表上新了！」—— 本用例要验的就是它，先不要点掉（下一屏描述里验），但若已点掉，s1 landing 仍应满足。"

  - id: s1
    desc: 观察清理后首次启动日历首页上弹出的课程表功能引导框（标题「课程表上新了！」），随后点掉它（timetable_guide_button「我知道了」），落回日历首页
    landing: activity=.AllInOneActivity
    know:
      where: 日历首页
      why_this: 用例预期 1「首次进入课程表功能时弹出功能引导弹框，清晰展示课程表核心操作说明」
      locate: 引导框按钮 rid=timetable_guide_button，文案「我知道了」
    pitfalls:
      - "引导框触发时机是「pm clear 后首次启动、在【日历主页】上弹」，不是进入课程表功能时弹 —— 所以这一屏要停在首页看它，别先跳去课程表。"
      - "引导框文案：标题「课程表上新了！」/ 正文「点击快速导入课表，自动同步所有上课时间」/ 按钮「我知道了」；rid：curriculum_guide_title / curriculum_guide_message / timetable_guide_button。"
      - "冷启动不会再弹（本地已记『看过』），复现不出来就说明这轮没清数据 —— 不是产品缺陷。"
      - "若引导框确实没出现（例如上一屏已被点掉），本步点不到 target 时不要硬点，直接判本步为已完成、交给断言 a1 判。"

  - id: s2
    desc: 在日历首页点右上角「更多」图标（iv_more，无文字），在弹出的菜单里选「课程表」菜单项，进入课程表页
    target: rid=iv_more
    landing: activity=.timetable.display.TimetableActivity
    know:
      where: 首页 → 课程表
      why_this: 用例操作步骤 1「日历首页点击页面右上角更多按钮，选择课程表选项」
      locate: iv_more 是右上角那个三点图标，本身没有任何文字
    pitfalls:
      - "iv_more 没有 text/desc —— 用文案找「更多」会找不到，必须按 rid 定位。"
      - "菜单四项共用 rid item_title，只能按 text 区分；这一步代码只能点到 iv_more，菜单里选「课程表」交给模型。"
      - "无课程表时落点是课程表页-空态：屏幕中央「还未添加课程表」，此时没有工具栏，不要再找「更多」。"
      - "若菜单没弹出（点空了），不要重复点同一坐标硬试 —— 回读 activity 确认当前在哪。"

assertions:
  - id: a1
    desc: 首次进入课程表功能时弹出功能引导弹框（引导页 TimetableGuideActivity 到达过）
    # 用 activity 而不是 rid=curriculum_guide_title：
    # 引导框属于"干扰弹框"，执行器会主动点掉，node_present 的观察窗口容易错过这一瞬。
    # 实测该 rid 两次都「没见过该控件」→ 本机核不到，改用"到达过该页"这个客观事实。
    check:
      activity: TimetableGuideActivity

  - id: a2
    desc: 引导框正文展示课程表核心操作说明
    # ⚠️ 诚实标注：本机无法用结构化判据核实该文案。
    # 两次实测 rid=curriculum_guide_message 均「没见过该控件」，
    # 引导正文「点击快速导入课表，自动同步所有上课时间」需人工看图确认。
    # 本条只判"引导页到达过"，**不作为文案清晰/完整的 PASS 依据**。
    note: 引导正文文案未做结构化核对，需人工看图；本断言不覆盖文案验收
    check:
      activity: TimetableGuideActivity

  - id: a3
    desc: 进入课程表页后，无课程表时显示空页面状态：拍照导入 / 图库导入 / 手动创建三个操作按钮铺屏
    # 用三个入口 rid 作空态的结构判据 —— 空态与周视图的区别就在这里。
    # 「还未添加课程表」文案本机 UI 树取不到（实测 ✘），不做文本断言。
    check:
      nodes_present:
        - {rid: btnImportFromPhoto}
        - {rid: btnImportFromGallery}
        - {rid: btnCreateManually}
